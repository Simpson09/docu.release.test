name: Deploy Docusaurus to GitHub Pages with PDF

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build

      # npx wait-on 대신 백그라운드 실행 및 sleep 사용
      - name: Start Docusaurus server in background
        run: |
          npm run serve -- --port 3000 --host 127.0.0.1 &
          sleep 10

      - name: Generate PDF via Puppeteer
        run: node scripts/generate-pdf.js

      - name: Copy PDF to Build output
        run: |
          mkdir -p build/files
          cp static/files/Manual.pdf build/files/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4